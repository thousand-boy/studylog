name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # テスト用のPostgreSQL（Django がテストのたびにテスト用DBを作って削除する）
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: studylog
          POSTGRES_USER: studylog
          POSTGRES_PASSWORD: studylog
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studylog -d studylog"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    # CI専用の値。本物の SECRET_KEY やパスワードはここに書かない
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key-not-used-anywhere-else
      DJANGO_DEBUG: "False"
      POSTGRES_DB: studylog
      POSTGRES_USER: studylog
      POSTGRES_PASSWORD: studylog
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python manage.py test
